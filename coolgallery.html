<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="description" content="A swipe-first gallery for selecting favorite prints." />
    <meta name="keywords" content="photography, gallery, swipe, prints, favorites, curated, interactive" />
    <meta name="author" content="AL" />
    <meta property="og:title" content="CoolGallery — AL" />
    <meta property="og:description" content="A swipe-first gallery for selecting favorite prints." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.com/coolgallery.html" />
    <meta property="og:image" content="https://your-domain.com/Photos%201/Stonewall.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CoolGallery — AL" />
    <meta name="twitter:description" content="A swipe-first gallery for selecting favorite prints." />
    <meta name="twitter:image" content="https://your-domain.com/Photos%201/Stonewall.jpg" />
    <link rel="canonical" href="https://your-domain.com/coolgallery.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page-body" data-page="coolgallery">
    <header class="site-header">
      <div class="site-header__inner">
        <a class="site-logo" href="index.html">AL</a>
        <nav class="site-nav" aria-label="Primary">
          <a href="index.html" data-nav="home">Home</a>
          <a href="store.html" data-nav="store">Store</a>
          <a href="coolgallery.html" data-nav="coolgallery">CoolGallery</a>
          <a href="about.html" data-nav="about">About</a>
          <button
            type="button"
            class="cart-btn"
            aria-label="Open cart"
            title="Cart"
          >
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              aria-hidden="true"
            >
              <path d="M6 6h15l-1.5 9h-12z" />
              <path d="M6 6 5 3H2" />
              <circle cx="9" cy="20" r="1" />
              <circle cx="18" cy="20" r="1" />
            </svg>
            <span class="cart-btn__badge" aria-live="polite">0</span>
          </button>
        </nav>
      </div>
    </header>

    <main class="page-main">
      <section class="coolgallery-hero reveal">
        <div class="coolgallery-hero__inner">
          <p class="page-subtitle">CoolGallery</p>
          <h1 class="page-title">Swipe to choose your favorite prints</h1>
          <p class="coolgallery-hero-copy">
            Start a playful swipe experience with the same curated photography from the store. Tap Start, then drag the card left or right to pass or keep each image.
          </p>
          <button type="button" class="btn btn--primary coolgallery-start" data-action="start">
            Start the gallery
          </button>
        </div>
      </section>

      <div id="coolgallery-root" aria-busy="true"></div>
    </main>

    <footer class="page-footer">
      <p>© <span id="y"></span> AL.</p>
    </footer>
    <script src="common.js" defer></script>
    <script src="script.js" defer></script>
  </body>
</html>
